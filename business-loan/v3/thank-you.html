<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Thank You | CA Mantra — Design V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f6f8fa;--cream-2:#eaeef2;--paper:#fdfdfe;--ink:#171b1f;--forest:#1c4f7e;--forest-deep:#122f4c;--clay:#2274b5;--clay-soft:#ddebf7;--muted:#5e6a75;--line-2:#c9d3dc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
.hdr{border-bottom:1px solid #dfe4ea}
.hdr .wrap{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;align-items:center;height:70px}
.logo{text-decoration:none;display:flex;align-items:center}
.logo-img{height:34px;width:auto;display:block}
main{flex:1;display:grid;place-items:center;padding:40px 22px}
.card{background:var(--paper);border:1px solid var(--line-2);max-width:560px;padding:52px 40px;text-align:center;box-shadow:8px 8px 0 var(--cream-2)}
.tick{font-family:'Fraunces',serif;font-size:52px;color:var(--clay);line-height:1;margin-bottom:18px}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:30px;line-height:1.25;margin-bottom:16px}
p{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.confirm{background:var(--clay-soft);border-bottom:1px dashed var(--clay);padding:0 3px;border-radius:2px;cursor:help}
.call{display:inline-flex;align-items:center;gap:9px;margin-top:14px;padding:14px 30px;background:var(--forest);color:var(--cream);border-radius:999px;text-decoration:none;font-weight:600;font-size:15px}
.call:hover{background:var(--forest-deep)}
.back{display:block;margin-top:20px;font-size:13px;color:var(--muted)}
.back a{color:var(--forest)}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img class="logo-img" src="../../assets/camantra-logo.jpg" alt="AVS &amp; Associates — Chartered Accountants">
    </a>
  </div>
</header>
<main>
  <div class="card">
    <div class="tick">✓</div>
    <h1>Thanks — we have your details.</h1>
    <p>A CA from our team will call you on the number you gave us, today if you submitted during working hours, otherwise first thing on the next working day.</p>
    <p>Want to talk sooner?</p>
    <a class="call" href="tel:+919800000000">Call us on +91 98XXX XXXXX</a>
    <span class="back"><a href="index.html">&larr; Back to the page (design preview only)</a></span>
  </div>
</main>
</body>
</html>
