<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Thank You | CA Mantra — Design V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e2a4f;--blue:#2e7cc0;--blue-2:#1b4d8c;--blue-soft:#e3eef8;--soft:#f2f7fc;--muted:#5a6b7d;--line:#dfe7ef}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(180deg,#fff 0%,var(--soft) 100%);color:#2a3b4d;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
.hdr{background:#fff;border-bottom:1px solid var(--line)}
.hdr .wrap{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:68px}
.logo{display:flex;align-items:center;text-decoration:none}
.logo-img{height:36px;width:auto;display:block}
main{flex:1;display:grid;place-items:center;padding:40px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 28px 70px rgba(14,42,79,.14);max-width:560px;padding:46px 36px;text-align:center}
.tick{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#4d9bd8,var(--blue));color:#fff;display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 12px 30px rgba(46,124,192,.35)}
h1{font-family:'Plus Jakarta Sans';color:var(--ink);font-size:27px;line-height:1.3;letter-spacing:-.02em;margin-bottom:14px}
p{color:var(--muted);font-size:15.5px;margin-bottom:12px}
.call{display:inline-flex;align-items:center;gap:9px;margin-top:14px;padding:14px 28px;background:linear-gradient(90deg,var(--blue),var(--blue-2));color:#fff;border-radius:12px;text-decoration:none;font-family:'Plus Jakarta Sans';font-weight:700;font-size:15px;box-shadow:0 10px 26px rgba(46,124,192,.35)}
.back{display:block;margin-top:20px;font-size:13px;color:var(--muted)}
.back a{color:var(--blue-2)}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img class="logo-img" src="../../assets/camantra-logo.jpg" alt="AVS &amp; Associates — Chartered Accountants">
    </a>
  </div>
</header>
<main>
  <div class="card">
    <div class="tick"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Thanks — we have your details.</h1>
    <p>A CA from our team will call you on the number you gave us, today if you submitted during working hours, otherwise first thing on the next working day.</p>
    <p>Want to talk sooner?</p>
    <a class="call" href="tel:+919800000000">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>
      Call us on +91 98XXX XXXXX
    </a>
    <span class="back"><a href="index.html">&larr; Back to the page (design preview only)</a></span>
  </div>
</main>
</body>
</html>
