<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Thank You | CA Mantra — Design V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-dark:#080f1a;--mint:#4da8ec;--mint-dark:#2278c8;--txt-dim:#93a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(900px 600px at 50% -10%,rgba(77,168,236,.14),transparent 60%),var(--bg-dark);color:#e8eef6;line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
.hdr{border-bottom:1px solid #22304566}
.hdr .wrap{max-width:1160px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-img{height:38px;width:auto;display:block;background:#fff;padding:6px 10px;border-radius:10px}
main{flex:1;display:grid;place-items:center;padding:40px 20px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);border-radius:24px;backdrop-filter:blur(14px);max-width:560px;padding:48px 36px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.tick{width:80px;height:80px;border-radius:50%;background:rgba(77,168,236,.15);color:var(--mint);display:grid;place-items:center;margin:0 auto 24px;box-shadow:0 0 0 10px rgba(77,168,236,.06)}
h1{font-family:'Space Grotesk';color:#fff;font-size:28px;letter-spacing:-.02em;line-height:1.25;margin-bottom:14px}
p{color:var(--txt-dim);font-size:15.5px;margin-bottom:12px}
.confirm{background:rgba(77,168,236,.14);border-bottom:1px dashed var(--mint-dark);padding:0 3px;border-radius:3px;cursor:help}
.call{display:inline-flex;align-items:center;gap:9px;margin-top:14px;padding:14px 28px;background:linear-gradient(90deg,var(--mint),var(--mint-dark));color:#fff;border-radius:12px;text-decoration:none;font-family:'Space Grotesk';font-weight:700;font-size:15px;box-shadow:0 10px 30px rgba(77,168,236,.25)}
.back{display:block;margin-top:20px;font-size:13px}
.back a{color:var(--mint)}
</style>
</head>
<body>
<header class="hdr">
  <div class="wrap">
    <a class="logo" href="index.html">
      <img class="logo-img" src="../../assets/camantra-logo.jpg" alt="AVS &amp; Associates — Chartered Accountants">
    </a>
  </div>
</header>
<main>
  <div class="card">
    <div class="tick"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Thanks — we have your details.</h1>
    <p>A CA from our team will call you on the number you gave us, today if you submitted during working hours, otherwise first thing on the next working day.</p>
    <p>Want to talk sooner?</p>
    <a class="call" href="tel:+919800000000">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg>
      Call us on +91 98XXX XXXXX
    </a>
    <span class="back"><a href="index.html">&larr; Back to the page (design preview only)</a></span>
  </div>
</main>
</body>
</html>
